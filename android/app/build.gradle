apply plugin: 'com.android.application'

// One version number for the whole project: package.json.
// versionCode can be overridden (CI passes the build number); otherwise 1.2.3 becomes 10203.
def packageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = packageJson.version
def versionParts = appVersionName.tokenize('.').collect { it.replaceAll(/\D.*/, '').toInteger() }
def appVersionCode = (System.getenv('RIPPL_VERSION_CODE') ?: (versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2])).toInteger()

// Release signing comes from the environment, so no key or password ever lives in the repo.
// See docs/RELEASING.md.
def keystoreFile = System.getenv('RIPPL_KEYSTORE_FILE')

// CI signs debug builds with one shared debug key, so a new test build installs over the last.
// Without it, Gradle uses the machine's own debug key as usual.
def debugKeystoreFile = System.getenv('RIPPL_DEBUG_KEYSTORE_FILE')

android {
    namespace = "io.github.tsv30.ripplstudio"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.tsv30.ripplstudio"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            if (debugKeystoreFile) {
                storeFile file(debugKeystoreFile)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (keystoreFile) {
                storeFile file(keystoreFile)
                storePassword System.getenv('RIPPL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RIPPL_KEY_ALIAS')
                keyPassword System.getenv('RIPPL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Serves the app's bundled files to the live wallpaper's own WebView
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
