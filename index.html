<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
        <meta name="theme-color" content="#000000">
        <meta name="color-scheme" content="dark">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">

        <link rel="manifest" href="manifest.webmanifest">
        <link rel="apple-touch-icon" href="icons/icon-192.png">
        <link rel="icon" href="icons/icon-192.png">

        <title>RIPPL Studio</title>
        <meta name="description" content="RIPPL Studio: paint with living fluid. An interactive fluid simulation for your phone and browser.">

        <meta property="og:type" content="website">
        <meta property="og:title" content="RIPPL Studio">
        <meta property="og:description" content="Paint with living fluid. An interactive fluid simulation for your phone and browser.">
        <meta property="og:image" content="screenshot.jpg">

        <link rel="stylesheet" href="ui.css?v=1.0.3">
    </head>
    <body>
        <canvas role="img" aria-label="Interactive fluid simulation. Drag to stir the fluid; open Controls for settings."></canvas>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <div class="modal" id="modal" hidden>
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <h2 id="modal-title"></h2>
                <p id="modal-text"></p>
                <textarea id="modal-input" spellcheck="false" hidden></textarea>
                <input class="modal-file" id="modal-file" type="file" accept=".json,application/json,text/plain" aria-label="Choose a preset file" hidden>
                <p class="modal-error" id="modal-error" role="alert"></p>
                <div class="modal-actions" id="modal-actions"></div>
            </div>
        </div>

        <noscript>RIPPL Studio needs JavaScript to run.</noscript>

        <script src="native.js?v=1.0.3"></script>
        <script src="ui.js?v=1.0.3"></script>
        <script src="script.js?v=1.0.3"></script>
    </body>
</html>
